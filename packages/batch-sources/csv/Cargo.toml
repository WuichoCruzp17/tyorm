[package]
name = "tyorm-batch-csv"
version.workspace = true
edition.workspace = true

[lib]
name = "tyorm_batch_csv"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2.7.0"

[dependencies]
csv = "1.4.0"
encoding_rs = "0.8.44"
encoding_rs_io = "0.1.8"
napi = { version = "3.16.3", features = ["napi8"] }
napi-derive = { version = "3.7.2", features = ["type-def"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
